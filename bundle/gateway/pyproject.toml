[project]
name = "mcp-toolrank-gateway-bundle"
version = "0.3.0"
requires-python = ">=3.12,<3.14"
dependencies = ["toolrank-cpu[gateway]==0.3.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
toolrank-cpu = { path = "wheels/toolrank_cpu-0.3.0-py3-none-any.whl" }
