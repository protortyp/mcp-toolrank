[project]
name = "toolrank"
version = "0.1.0"
description = "Local embedding retrieval and evaluation for MCP tool catalogs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "sentence-transformers==5.2.3",
    "transformers==4.57.6",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cu128 = ["torch==2.8.0"]

[dependency-groups]
research = ["pyarrow==26.0.1", "scikit-learn==1.9.1"]
onnx = ["onnx==1.20.1", "onnxruntime==1.24.1"]
examples = ["langchain==1.2.12", "pydantic-ai-slim==1.68.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolrank"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
