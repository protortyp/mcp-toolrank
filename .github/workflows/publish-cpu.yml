name: Publish CPU wheel to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published CPU release tag, such as cpu-v0.6.0
        required: true
        type: string
      upload:
        description: Upload after verification
        default: false
        type: boolean

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag }}

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Verify released distributions
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^cpu-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#cpu-v}"
          wheel="toolrank_cpu-$version-py3-none-any.whl"
          source="toolrank_cpu-$version.tar.gz"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir dist
          cd dist
          for file in "$wheel" "$source" SHA256SUMS; do
            curl -fsSLO --retry 3 "$release_url/$file"
          done
          test "$(wc -l < SHA256SUMS)" -eq 2
          for file in "$wheel" "$source"; do
            awk -v file="$file" '$2 == file {print; found++} END {exit found != 1}' SHA256SUMS |
              sha256sum --strict --check -
          done
          uv publish --dry-run --trusted-publishing never "$wheel" "$source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-cpu-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.upload
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-cpu-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
