name: Publish MCP Registry listing

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Registry listing
        type: choice
        options: [catalog, gateway]
        default: catalog

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REGISTRY_MANIFEST: ${{ inputs.bundle == 'gateway' && 'bundle/gateway/server.json' || 'server.json' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the published bundle
        run: |
          url=$(jq -er '.packages[0].identifier' "$REGISTRY_MANIFEST")
          checksum=$(jq -er '.packages[0].fileSha256' "$REGISTRY_MANIFEST")
          version=$(jq -er '.version' "$REGISTRY_MANIFEST")
          name=$(jq -er '.name | split("/")[-1]' "$REGISTRY_MANIFEST")
          curl -fsSL --retry 3 "$url" -o toolrank.mcpb
          printf '%s  toolrank.mcpb\n' "$checksum" | sha256sum -c -
          unzip -p toolrank.mcpb manifest.json | jq -e --arg version "$version" --arg name "$name" '.version == $version and .name == $name'
      - name: Verify MCP Registry publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.10/mcp-publisher_linux_amd64.tar.gz \
            -o publisher.tar.gz
          printf '%s  publisher.tar.gz\n' 32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Publish the listing
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish "$REGISTRY_MANIFEST"
