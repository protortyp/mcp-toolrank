[project]
name = "toolrank-cpu"
version = "0.4.0"
description = "Local ToolRank CPU retrieval for MCP and OpenAPI catalogs"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "numpy==2.5.5",
    "onnxruntime==1.24.1",
    "tokenizers==0.22.2",
]

[project.scripts]
toolrank-cpu = "toolrank_cpu.cli:main"
toolrank-gateway = "toolrank_cpu.cli:gateway_main"

[project.optional-dependencies]
gateway = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mcp==1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolrank_cpu"]

[tool.hatch.build.targets.sdist]
include = ["/hatch_build.py", "/pyproject.toml", "/toolrank_cpu", "/uv.lock"]

[tool.hatch.build.hooks.custom]
