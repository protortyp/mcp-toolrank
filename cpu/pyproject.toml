[project]
name = "toolrank-cpu"
version = "0.6.0"
description = "Local ToolRank CPU retrieval for MCP and OpenAPI catalogs"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
dependencies = [
    "numpy==2.4.6; python_version == '3.11'",
    "numpy==2.5.5; python_version >= '3.12'",
    "onnxruntime==1.24.1",
    "tokenizers==0.22.2",
]

[project.urls]
Repository = "https://github.com/protortyp/mcp-toolrank"
Documentation = "https://github.com/protortyp/mcp-toolrank/blob/main/docs/GATEWAY.md"
Issues = "https://github.com/protortyp/mcp-toolrank/issues"
Model = "https://huggingface.co/christianengel/mcp-toolrank-33m"

[project.scripts]
toolrank-cpu = "toolrank_cpu.cli:main"
toolrank-gateway = "toolrank_cpu.cli:gateway_main"

[project.optional-dependencies]
gateway = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mcp==1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolrank_cpu"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/hatch_build.py", "/pyproject.toml", "/toolrank_cpu", "/uv.lock"]

[tool.hatch.build.hooks.custom]
